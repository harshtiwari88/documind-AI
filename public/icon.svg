<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />

  <!-- Antenna -->
  <line x1="60" y1="24" x2="60" y2="15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="13" r="5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="60" cy="13" r="2.5" fill="#ffffff" />

  <!-- Ears -->
  <rect x="23" y="40" width="6" height="18" rx="3" fill="#38bdf8" />
  <rect x="91" y="40" width="6" height="18" rx="3" fill="#38bdf8" />

  <!-- Head -->
  <rect x="27" y="24" width="66" height="50" rx="18" fill="url(#headGrad)" stroke="#38bdf8" stroke-width="2" />
  <!-- Visor -->
  <rect x="33" y="32" width="54" height="34" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1.5" />

  <!-- Glowing Eyes -->
  <ellipse cx="46" cy="48" rx="6.5" ry="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <ellipse cx="74" cy="48" rx="6.5" ry="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="48" cy="45.5" r="2.5" fill="#ffffff" />
  <circle cx="76" cy="45.5" r="2.5" fill="#ffffff" />

  <!-- Smile -->
  <path d="M54 57 Q60 61 66 57" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Body -->
  <rect x="36" y="80" width="48" height="28" rx="8" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="60" cy="94" r="6" fill="#0f172a" stroke="#00f5d4" stroke-width="1.5" />
  <path d="M58 92 L62 94 L58 96 Z" fill="#00f5d4" />
</svg>
