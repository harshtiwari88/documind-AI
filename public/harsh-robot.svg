<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="60" y1="22" x2="60" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="10" r="5" fill="#00f5d4" filter="url(#glow)" />
  <circle cx="60" cy="10" r="2.5" fill="#ffffff" />

  <!-- Robot Ears / Headphone nodes -->
  <rect x="23" y="38" width="6" height="18" rx="3" fill="#38bdf8" />
  <rect x="91" y="38" width="6" height="18" rx="3" fill="#38bdf8" />
  <circle cx="26" cy="47" r="2" fill="#00f5d4" />
  <circle cx="94" cy="47" r="2" fill="#00f5d4" />

  <!-- Robot Head Outline -->
  <rect x="27" y="22" width="66" height="50" rx="18" fill="url(#headGrad)" stroke="#38bdf8" stroke-width="2" />

  <!-- Face Visor Screen -->
  <rect x="33" y="30" width="54" height="34" rx="12" fill="url(#visorGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Expressive Glowing Cyan Eyes -->
  <ellipse cx="46" cy="46" rx="6.5" ry="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <ellipse cx="74" cy="46" rx="6.5" ry="7" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="48" cy="43.5" r="2.5" fill="#ffffff" />
  <circle cx="76" cy="43.5" r="2.5" fill="#ffffff" />

  <!-- Cute Digital Smile / Voice Waveform -->
  <path d="M54 55 Q60 59 66 55" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Neck -->
  <rect x="52" y="73" width="16" height="6" rx="2" fill="#1e293b" />

  <!-- Body Chassis -->
  <rect x="34" y="80" width="52" height="32" rx="10" fill="url(#bodyGrad)" stroke="#38bdf8" stroke-width="1.8" />

  <!-- Body Core Chest Reactor / Docu Logo -->
  <circle cx="60" cy="94" r="8" fill="#0f172a" stroke="#00f5d4" stroke-width="1.5" />
  <path d="M57 91 L63 94 L57 97 Z" fill="#00f5d4" filter="url(#glow)" />

  <!-- Body Status Indicators -->
  <circle cx="44" cy="94" r="2" fill="#38bdf8" />
  <circle cx="76" cy="94" r="2" fill="#00f5d4" />
</svg>
