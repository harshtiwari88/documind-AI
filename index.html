<!doctype html>
<html lang="en" style="background-color: #0b132b; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Harsh AI – Your Intelligent Document &amp; AI Companion</title>
    <meta name="description" content="Harsh AI is your intelligent document companion with an advanced PDF editor, dual-mode voice editing, Gemini AI assistant, and instant PDF tools." />
    <meta property="og:title" content="Harsh AI – Your Intelligent Document &amp; AI Companion" />
    <meta property="og:description" content="Harsh AI is your intelligent document companion with an advanced PDF editor, dual-mode voice editing, Gemini AI assistant, and instant PDF tools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Android & Modern Chromium Standalone / Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Harsh AI" />
    <meta name="theme-color" content="#0b132b" />
    <meta name="color-scheme" content="dark" />
    <meta name="msapplication-TileColor" content="#0b132b" />
    <meta name="msapplication-navbutton-color" content="#0b132b" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- iOS Safari Standalone & Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Harsh AI" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Standard Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0b132b;
        color: #f8fafc;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        background-color: #0b132b;
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.96); }
      }
    </style>
  </head>
  <body style="background-color: #0b132b;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b132b; color: #00f5d4; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px;">
        <div style="text-align: center; max-width: 320px; animation: pulseSlow 2s ease-in-out infinite;">
          <div style="width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; background: rgba(0, 245, 212, 0.12); border: 1.5px solid rgba(0, 245, 212, 0.35); display: flex; align-items: center; justify-content: center;">
            <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
              <rect x="12" y="14" width="40" height="38" rx="8" fill="#121d38" stroke="#00f5d4" stroke-width="3"/>
              <circle cx="24" cy="30" r="4" fill="#00f5d4"/>
              <circle cx="40" cy="30" r="4" fill="#00f5d4"/>
              <line x1="24" y1="42" x2="40" y2="42" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <div style="font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px;">
            Harsh <span style="color: #00f5d4;">AI</span>
          </div>
          <div style="font-size: 13px; color: #94a3b8; margin-top: 6px; font-weight: 500;">
            Loading application…
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
